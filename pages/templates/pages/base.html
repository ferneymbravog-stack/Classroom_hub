<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ClassroomHub{% endblock %}</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            max-width: 800px;
            margin: 0 auto;
            padding: 30px 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            color: #2d3748;
            background-color: #f7fafc;
        }
        header {
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 20px;
            margin-bottom: 24px;
        }
        header h1 {
            color: #1a202c;
            font-size: 1.8rem;
            margin-bottom: 12px;
        }
        nav {
            display: flex;
            gap: 16px;
        }
        nav a {
            color: #3182ce;
            text-decoration: none;
            font-weight: 500;
            padding: 6px 12px;
            border-radius: 6px;
            transition: background 0.15s;
        }
        nav a:hover {
            background-color: #ebf8ff;
            text-decoration: none;
        }
        main {
            min-height: 300px;
        }
        .btn {
            display: inline-block;
            background-color: #3182ce;
            color: #ffffff;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 500;
            margin-top: 12px;
        }
        .btn:hover {
            background-color: #2b6cb0;
        }
        .resource {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 14px;
        }
        .resource h3 {
            color: #2d3748;
            margin-bottom: 6px;
        }
        footer {
            border-top: 1px solid #e2e8f0;
            padding-top: 20px;
            margin-top: 40px;
            color: #718096;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <header>
        <h1>ClassroomHub</h1>
        <nav aria-label="Main navigation">
            <a href="{% url 'pages:home' %}">Home</a>
            <a href="{% url 'pages:resources' %}">Resources</a>
            <a href="{% url 'pages:about' %}">About</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <small>ClassroomHub — Learning project</small>
    </footer>
</body>
</html>
